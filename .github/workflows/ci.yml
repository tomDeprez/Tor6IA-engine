name: CI

# Every push: tests, then the real demo on Windows, Linux and macOS with a tiny model.
# A tag vX.Y.Z also publishes the release and checks the one-line install.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # A 1 MB story model: enough to prove the layers really are placed on the block servers.
  TINY_MODEL: https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l . proof)
          if [ -n "$unformatted" ]; then echo "Run gofmt on: $unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      - name: A locked-in program cannot read a personal file, connect out, start a program or exceed its memory, and stops with a killed engine
        run: |
          go build -o "engine$(go env GOEXE)" .
          "./engine$(go env GOEXE)" jail-test
      - name: Split a model across three locked-in block servers
        env:
          # GitHub's macOS machines have a virtual graphics card on which a block server stops with
          # "unsupported op": there the demo runs on the processor.
          DEVICE: ${{ runner.os == 'macOS' && '--device CPU' || '' }}
        run: |
          go build -o "engine$(go env GOEXE)" .
          curl -fL -o tiny.gguf "$TINY_MODEL"
          "./engine$(go env GOEXE)" demo --model tiny.gguf --machines 3 --prompt "Once upon a time" $DEVICE | tee demo.txt
          grep -q "tokens per second" demo.txt
      - name: A holder and a head on an encrypted link
        env:
          DEVICE: ${{ runner.os == 'macOS' && '--device CPU' || '' }}
        run: |
          E="./engine$(go env GOEXE)"
          "$E" block --model tiny.gguf --blocks 1 --listen 127.0.0.1:50071 --json $DEVICE > block.json &
          for _ in $(seq 1 60); do grep -q '"ready"' block.json && break; sleep 1; done
          LINE=$(grep '"ready"' block.json | sed 's/.*"announce":"\([^"]*\)".*/\1/')
          echo "line: ${LINE%#*}#(secret)"
          # A head without the right secret is refused.
          if "$E" head --model tiny.gguf --blocks "${LINE%#*}#00112233445566778899aabbccddeeff" --port 8171 2> wrong.txt; then echo "a wrong secret was accepted"; exit 1; fi
          cat wrong.txt
          "$E" head --model tiny.gguf --blocks "$LINE" --port 8171 --json > head.json &
          for _ in $(seq 1 120); do [ -s head.json ] && break; sleep 1; done
          cat head.json
          curl -s -m 60 http://127.0.0.1:8171/v1/chat/completions -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"Once upon a time"}],"max_tokens":16}' | tee answer.json
          grep -q '"content"' answer.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/} ext=
            if [ "$os" = windows ]; then ext=.exe; fi
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${TAG#v}" -o "dist/tor6ia-engine-$os-$arch$ext" .
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v head="## $TAG" '$0 == head { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section '## $TAG'"; exit 1; fi
          gh release create "$TAG" dist/tor6ia-engine-* --title "$TAG" --notes-file notes.md

  # Runs the documented one-line install on clean machines, then the demo.
  install-test:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sh install.sh
      - env:
          DEVICE: ${{ runner.os == 'macOS' && '--device CPU' || '' }}
        run: |
          curl -fL -o tiny.gguf "$TINY_MODEL"
          "$HOME/.local/bin/tor6ia-engine" demo --model tiny.gguf --machines 3 --prompt "Once upon a time" $DEVICE | tee demo.txt
          grep -q "tokens per second" demo.txt
